name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          yarn install --immutable --mode=skip-build

      - name: Restore validated build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/charts-dist

      - name: Prepare validated package
        run: yarn prepare:publish "$RUNNER_TEMP/charts-dist"

      - name: Publish release
        run: yarn release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
