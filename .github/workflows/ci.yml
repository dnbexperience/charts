name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-id:
        description: Validated package build
        value: ${{ jobs.validate.outputs.artifact-id }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked dependencies
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          yarn install --immutable

      - name: Install Chromium
        run: yarn exec playwright install --with-deps chromium

      - name: Validate package and gallery
        run: yarn ci

      - name: Save validated build
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: charts-dist-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Save gallery preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gallery-pages
          path: .pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
